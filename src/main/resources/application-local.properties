# Disable Google OAuth2 for local development
spring.security.oauth2.client.registration.google.enabled=false

# Configure a mock user for local development
spring.security.user.name=local-user
spring.security.user.password=local-password
spring.security.user.roles=USER

# Enable basic authentication
spring.security.basic.enabled=true

# Disable CSRF for local development
spring.security.csrf.enabled=false

# Configure CORS for local development
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true